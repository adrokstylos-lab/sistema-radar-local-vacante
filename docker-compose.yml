services:
  db:
    image: postgis/postgis:16-3.4
    container_name: radar_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  radar_pgdata:
